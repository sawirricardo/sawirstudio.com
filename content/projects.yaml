  - 3
  search: 'math daily build a daily math habit in a minute a day, with the math monsters education build a daily math habit in minutes a day, with the math monsters. math daily gives you quick, focused practice sessions for addition, subtraction, multiplication and division. meet plumo, mino, tixi and divvy: four friendly monsters shaped like +, −, × and ÷, who play the operators in every problem, cheer when you''re right and droop when you''re not. now there''s a fifth: perci, shaped like %, who asks fractions, percents and decimals like ¾ of 20 and 25% of 60, plus everyday money: tips, discounts and splitting the bill. a session is 10 problems and takes about a minute. math daily builds fact fluency, the quick and correct recall of facts you''ve already learned. use it alongside school or homework, not instead of it. problems you miss come back the next day, and you can print a practice sheet to take it onto paper.'
