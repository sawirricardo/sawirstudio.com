<h1 class="page-title">联系我们</h1>
<p class="lead-sm">请告诉我们您的项目情况。您提供的信息越详细，我们越能在早期给出准确的判断。</p>
</section>
<section class="section">
<div class="contact-layout">
<!-- Submits to the "SawirStudio inquiries" Google Form; field names are its entry IDs. -->
<form action="https://docs.google.com/forms/d/e/1FAIpQLScmTqIVTp7occKX6LdCkOhjFb3vuD-Pb2NoIXHMxnQ7xRenDQ/formResponse" class="inquiry" id="inquiry-form" method="post">
<div class="field">
<label for="name">姓名</label>
<input autocomplete="name" id="name" name="entry.888428388" required="" type="text"/>
</div>
<div class="field">
<label for="email">电子邮箱</label>
<input autocomplete="email" id="email" name="entry.454060139" required="" type="email"/>
</div>
<div class="field">
<label for="company">公司 <span class="optional">（选填）</span></label>
<input autocomplete="organization" id="company" name="entry.446250436" type="text"/>
</div>
<fieldset class="field">
<legend>您需要什么？</legend>
<div class="choices">
<div><input id="need-application" name="entry.1233160113" type="checkbox" value="Application"/><label for="need-application">应用程序</label></div>
<div><input id="need-website" name="entry.1233160113" type="checkbox" value="Website"/><label for="need-website">网站</label></div>
<div><input id="need-design" name="entry.1233160113" type="checkbox" value="Design"/><label for="need-design">设计</label></div>
<div><input id="need-unsure" name="entry.1233160113" type="checkbox" value="Not sure yet"/><label for="need-unsure">暂时还不确定</label></div>
</div>
</fieldset>
<div class="field">
<label for="message">请介绍一下您的项目</label>
<textarea id="message" name="entry.761558557" required="" rows="6"></textarea>
</div>
<button class="button" data-sending="发送中…" type="submit">提交咨询</button>
<p class="form-status form-error" hidden="" id="form-error" role="alert">提交咨询时出了点问题，请稍后再试。</p>
</form>
<div class="form-status form-success" hidden="" id="form-success" role="status" tabindex="-1">
<h2>谢谢！🎉</h2>
<p>您的咨询已发送。</p>
</div>
</div>
