<h1 class="page-title">聯絡我們</h1>
<p class="lead-sm">請告訴我們您的專案內容。提供的資訊越完整，我們越能及早掌握需求、給出精準的評估。</p>
</section>
<section class="section">
<div class="contact-layout">
<!-- Submits to the "SawirStudio inquiries" Google Form; field names are its entry IDs. -->
<form action="https://docs.google.com/forms/d/e/1FAIpQLScmTqIVTp7occKX6LdCkOhjFb3vuD-Pb2NoIXHMxnQ7xRenDQ/formResponse" class="inquiry" id="inquiry-form" method="post">
<div class="field">
<label for="name">姓名</label>
<input autocomplete="name" id="name" name="entry.888428388" required="" type="text"/>
</div>
<div class="field">
<label for="email">電子郵件</label>
<input autocomplete="email" id="email" name="entry.454060139" required="" type="email"/>
</div>
<div class="field">
<label for="company">公司 <span class="optional">（選填）</span></label>
<input autocomplete="organization" id="company" name="entry.446250436" type="text"/>
</div>
<fieldset class="field">
<legend>您需要什麼？</legend>
<div class="choices">
<div><input id="need-application" name="entry.1233160113" type="checkbox" value="Application"/><label for="need-application">應用程式</label></div>
<div><input id="need-website" name="entry.1233160113" type="checkbox" value="Website"/><label for="need-website">網站</label></div>
<div><input id="need-design" name="entry.1233160113" type="checkbox" value="Design"/><label for="need-design">設計</label></div>
<div><input id="need-unsure" name="entry.1233160113" type="checkbox" value="Not sure yet"/><label for="need-unsure">還不確定</label></div>
</div>
</fieldset>
<div class="field">
<label for="message">請告訴我們您的專案內容</label>
<textarea id="message" name="entry.761558557" required="" rows="6"></textarea>
</div>
<button class="button" data-sending="傳送中…" type="submit">送出諮詢</button>
<p class="form-status form-error" hidden="" id="form-error" role="alert">送出諮詢時發生問題，請稍後再試一次。</p>
</form>
<div class="form-status form-success" hidden="" id="form-success" role="status" tabindex="-1">
<h2>謝謝您！🎉</h2>
<p>您的諮詢已送出。</p>
</div>
</div>
